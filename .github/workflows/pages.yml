# Deploys the Pages site: `main` at the root (the live app, URL unchanged)
# and the `dev` branch under /dev/ (browser preview against the same lists,
# no Teams and no local server needed). A push to either branch redeploys
# both, each at its current tip.
name: pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: site/dev
      - run: rm -rf site/.git site/.github site/dev/.git site/dev/.github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
